# -------------------------------------------------------
# Database — reads from Railway env vars when deployed,
# falls back to localhost defaults for local dev.
# -------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/task_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-factory=false

server.port=${PORT:8080}

# Serialise LocalDate as "2025-01-15" not an array
spring.jackson.serialization.write-dates-as-timestamps=false
